
name: Python CI with Docker

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v


  docker-build:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ci-cd-demo:1.0 .

      - name: Test Docker container
        run: |
          docker run -d --name flask-app -p 5000:5000 ci-cd-demo:1.0
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:5000/ > /dev/null; then
              echo "Container is responding"
              exit 0
            fi
            sleep 1
          done
          docker logs flask-app
          exit 1

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/gitparthan/ci-cd-demo
          docker tag ci-cd-demo:1.0 $IMAGE:latest
          docker tag ci-cd-demo:1.0 $IMAGE:${GITHUB_SHA}
          docker push $IMAGE:latest
          docker push $IMAGE:${GITHUB_SHA}
